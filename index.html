<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0C09" />
    <meta
      name="description"
      content="Counter — a React counter experience with a bounded range, step control, live statistics and a timestamped activity log."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23CD9046'/%3E%3Cpath d='M8.5 12.5h6M11.5 9.5v6M17.5 20.5h6' stroke='%231C1712' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Applies the saved theme before the first paint so there is no flash.
      (function () {
        try {
          var saved = localStorage.getItem('counter.theme');
          var light = window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'dark' ? saved : light ? 'light' : 'dark';
        } catch (error) {
          /* private mode — keep the default dark theme */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Counter — Count every moment</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
